    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#82e6ff" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
